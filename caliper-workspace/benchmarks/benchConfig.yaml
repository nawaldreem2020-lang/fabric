# ============================================================================
#  BCMS — Blockchain Certificate Management System
#  Hyperledger Caliper Benchmark Configuration — fabric-BLAKE2-Security
#
#  Branch      : fabric-BLAKE2-Security
#  Crypto      : BLAKE2b-256 (golang.org/x/crypto/blake2b)
#  Hash Size   : 256-bit (32 bytes) — SHA-256 compatible output size
#
#  Performance Targets (vs SHA-256 baseline):
#    - IssueCertificate  : ≥110 TPS  (was 75  TPS with SHA-256)
#    - VerifyCertificate : ≥120 TPS  (was 100 TPS with SHA-256)
#    - QueryAll          :  50 TPS   (unchanged — I/O bound)
#    - RevokeCertificate : ≥110 TPS  (was 75  TPS with SHA-256)
#    - ByStudent         :  75 TPS   (unchanged)
#    - AuditLogs         :  30 TPS   (unchanged)
#    - Target Latency    : ≤60ms avg  (was ~90ms with SHA-256)
#    - Failure Rate      : 0%
#
#  Why BLAKE2b is faster:
#    ✓ Optimized for 64-bit CPUs — no padding overhead
#    ✓ Fewer rounds than SHA-2 (12 vs 64/80)
#    ✓ SIMD-friendly design
#    ✓ Benchmarks: ~900 MB/s vs ~350 MB/s (SHA-256) on modern hardware
#
#  Workers: 10 (increased from 8 for higher parallelism)
# ============================================================================

# ============================================================================
# RESOURCE MONITORS
# ============================================================================
monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - couchdb0
          - peer0.org2.example.com
          - couchdb1
          - ca_org1
          - ca_org2
          - ca_orderer

test:
  name: bcms-blake2b-security-benchmark
  description: >
    BCMS BLAKE2b-256 Security Benchmark — Branch: fabric-BLAKE2-Security.
    Replaces SHA-256 with BLAKE2b-256 (RFC 7693, golang.org/x/crypto/blake2b).
    Expected: ~3x hash speedup on 64-bit hardware, lower latency, higher TPS.
    Hash compatibility: 256-bit output = same size as SHA-256 (ledger compatible).
    Target: ≥110 TPS IssueCertificate, ≤60ms avg latency, 0% failure rate.
  workers:
    type: local
    number: 10

  rounds:
    # ──────────────────────────────────────────────────────────────────
    # Round 1: IssueCertificate — BLAKE2b-256 Write (was SHA-256)
    # Expected TPS: ≥110 TPS (BLAKE2b ~3x faster hash = fewer CPU cycles)
    # ──────────────────────────────────────────────────────────────────
    - label: IssueCertificate
      description: >
        Org1 issues educational certificates using BLAKE2b-256 hashing.
        H(C) = BLAKE2b-256(studentID|name|degree|issuer|date) — RFC 7693.
        BLAKE2b is ~3x faster than SHA-256 on 64-bit hardware.
        Zero-failure: idempotent — duplicate IDs return nil (not error).
        Higher TPS target vs SHA-256 baseline due to reduced hash overhead.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 110
      workload:
        module: workload/issueCertificate.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 2: VerifyCertificate — BLAKE2b-256 Read Verify
    # Expected TPS: ≥120 TPS (read-only + faster hash computation)
    # ──────────────────────────────────────────────────────────────────
    - label: VerifyCertificate
      description: >
        Verify certificate authenticity using BLAKE2b-256 hash comparison.
        Client computes BLAKE2b-256(fields) and compares with stored H(C).
        readOnly:true bypasses orderer — direct peer query for max throughput.
        Enhanced VerificationResult includes hashAlgorithm="BLAKE2b-256" field.
        Zero-failure: returns false (not error) when cert not found.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 120
      workload:
        module: workload/verifyCertificate.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 3: QueryAllCertificates — CouchDB Rich Query (unchanged)
    # I/O bound — hash algorithm has minimal impact on query TPS
    # ──────────────────────────────────────────────────────────────────
    - label: QueryAllCertificates
      description: >
        Rich ledger query returning all certificates sorted by issue date.
        Certificate records now include HashAlgorithm="BLAKE2b-256" field.
        Uses CouchDB selector with fallback to GetStateByRange for LevelDB.
        readOnly:true — direct peer query, no orderer involvement.
        Zero-failure design: returns empty slice on empty ledger.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/queryAllCertificates.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 4: RevokeCertificate — BLAKE2b Write (Org2 MSP)
    # Revocation does not re-hash — same TPS boost as issue
    # ──────────────────────────────────────────────────────────────────
    - label: RevokeCertificate
      description: >
        Org2 revokes certificates — RBAC: OR(Org1MSP.peer, Org2MSP.peer).
        Revocation is hash-algorithm agnostic (no re-hash needed).
        Marks IsRevoked=true, records RevokedBy and RevokedAt metadata.
        Zero-failure: idempotent — nil when cert not found or already revoked.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 110
      workload:
        module: workload/revokeCertificate.js
      txOptions:
        invokerIdentity: User1@org2.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 5: GetCertificatesByStudent — Student Query (unchanged)
    # ──────────────────────────────────────────────────────────────────
    - label: GetCertificatesByStudent
      description: >
        Query all certificates for a specific student using CouchDB rich query.
        Selector: {docType: "certificate", StudentID: "<id>"}.
        Public read — any organization can query.
        Zero-failure design: returns empty slice (never nil).
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/getCertificatesByStudent.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 6: GetAuditLogs — Audit Trail Query
    # ──────────────────────────────────────────────────────────────────
    - label: GetAuditLogs
      description: >
        Query the immutable audit log trail from the ledger.
        Returns all AuditLog entries sorted by timestamp descending.
        Public read — any organization can inspect the audit trail.
        Zero-failure design: returns empty slice (never nil).
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workload/getAuditLogs.js
      txOptions:
        invokerIdentity: User1@org1.example.com
