// ============================================================================
// BCMS — Blockchain Certificate Management System
// Hyperledger Caliper Benchmark Configuration v5.0 (BLAKE3 Edition)
// Research Paper: "Enhancing Trust and Transparency in Education Using 
// Blockchain: A Hyperledger Fabric-Based Framework"
//
// UPDATED: SHA-256 → BLAKE3 (Comparing Hashing Performance)
// ============================================================================

monitors:
  resource:
  - module: docker
    options:
      interval: 1
      containers:
      # Orderer
      - orderer.example.com
      # Org1 Peer & CouchDB
      - peer0.org1.example.com
      - couchdb0
      # Org2 Peer & CouchDB
      - peer0.org2.example.com
      - couchdb1
      # Certificate Authorities
      - ca_org1
      - ca_org2
      - ca_orderer

test:
  name: bcms-blake3-benchmark-v5
  description: >
    BCMS Full Benchmark Suite — BLAKE3 Implementation.
    Testing performance gain of BLAKE3 over SHA-256 baseline.
    Maintaining identical TPS rates (100, 50, 75, 30) for direct comparison.
  workers:
    type: local
    number: 8
  rounds:
    # ──────────────────────────────────────────────────────────────────
    # Round 1: IssueCertificate — BLAKE3 Hashing
    # ──────────────────────────────────────────────────────────────────
    - label: IssueCertificate
      description: >
        Org1 issues certificates using BLAKE3 hashing.
        RBAC enforced: only Org1MSP clients can invoke.
        Cryptographic: BLAKE3 H(C) = BLAKE3(studentID|name|degree|issuer|date).
        Zero-failure design: idempotent — duplicate IDs return nil.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/issueCertificate.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 2: VerifyCertificate — BLAKE3 Verification
    # ──────────────────────────────────────────────────────────────────
    - label: VerifyCertificate
      description: >
        Verify authenticity by recomputing BLAKE3 hash and comparing
        with stored H(C). Public read — bypasses orderer (readOnly:true).
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/verifyCertificate.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 3: QueryAllCertificates — BLAKE3 Ledger Query
    # ──────────────────────────────────────────────────────────────────
    - label: QueryAllCertificates
      description: >
        Rich query returning all certificates.
        Records now contain HashAlgorithm: "BLAKE3" metadata.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/queryAllCertificates.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 4: RevokeCertificate — BLAKE3-based Asset Update
    # ──────────────────────────────────────────────────────────────────
    - label: RevokeCertificate
      description: >
        Org2 revokes BLAKE3 certificates.
        RBAC: OR(Org1MSP.peer, Org2MSP.peer).
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/revokeCertificate.js
      txOptions:
        invokerIdentity: User1@org2.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 5: GetCertificatesByStudent — Indexed Lookup
    # ──────────────────────────────────────────────────────────────────
    - label: GetCertificatesByStudent
      description: >
        Query certificates for specific student (CouchDB selector).
        Validates retrieval of assets issued with BLAKE3 hashes.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workload/getCertificatesByStudent.js
      txOptions:
        invokerIdentity: User1@org1.example.com

    # ──────────────────────────────────────────────────────────────────
    # Round 6: GetAuditLogs — Audit Trail Integrity
    # ──────────────────────────────────────────────────────────────────
    - label: GetAuditLogs
      description: >
        Query the immutable audit log trail.
        Captures BLAKE3 transaction metadata for forensic audit.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workload/getAuditLogs.js
      txOptions:
        invokerIdentity: User1@org1.example.com
